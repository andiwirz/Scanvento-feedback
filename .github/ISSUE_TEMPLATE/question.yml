name: Frage / Question
description: Eine Frage zu Installation, Betrieb oder Bedienung. / A question about installation, operations or usage.
title: "[Frage / Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Vielleicht steht die Antwort schon in der Dokumentation: https://scanvento.com/docs
        The answer may already be in the documentation: https://scanvento.com/docs
  - type: textarea
    id: question
    attributes:
      label: Frage / Question
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version (optional)
